<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>비밀번호 재설정</title>
</head>
<body>
<form id="resetForm">
    <input type="password" name="newPwd" placeholder="새 비밀번호">
    <input type="password" name="confirmPwd" placeholder="비밀번호 확인">
    <button type="submit">비밀번호 재설정</button>
</form>

<script>
    const token = new URLSearchParams(window.location.search).get('token');

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const newPwd = document.querySelector('input[name="newPwd"]').value;
        const confirmPwd = document.querySelector('input[name="confirmPwd"]').value;

        if (newPwd !== confirmPwd) {
            alert("비밀번호가 일치하지 않습니다.");
            return;
        }

        const response = await fetch('/auth/password-reset/confirm?token=' + token, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({newPwd, confirmPwd})
        });

        if (response.ok) {
            alert('비밀번호가 재설정되었습니다.');
            window.location.href = '/login'; // 클라이언트에서 변경
        } else {
            alert('비밀번호 재설정에 실패했습니다.');
        }
    });
</script>
</body>
</html>
